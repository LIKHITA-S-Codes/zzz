<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessing...</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HACKER SCREEN -->
<div id="hackerScreen">
  <canvas class="hacker-3d-shiz"></canvas>
  <canvas class="bars-and-stuff"></canvas>
  <div class="output-console"></div>
</div>

<!-- ACCESS -->
<div id="accessOverlay">
  <button id="accessBtn">ALLOW ACCESS</button>
</div>

<!-- VALENTINE -->
<div id="valentineScreen">
  <div class="valentineContainer">
    <img
      src="https://image2url.com/r2/default/images/1769616553069-b86bebc2-cc34-4c89-81bc-fb1d49a8517f.png"
      class="valentineImage"
    />
    <h1 class="valentineText">Will you be my Valentine? 💖</h1>

    <div class="buttons">
      <button id="yesBtn">YES 💘</button>
      <button id="noBtn">NO 🙄</button>
    </div>
  </div>
</div>

<audio id="staticSound" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_38c6b4f1c1.mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
